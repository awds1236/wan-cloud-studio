<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wan Cloud Studio</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#10131c;color:#eef2ff}body{max-width:920px;margin:60px auto;padding:0 22px}header{margin-bottom:32px}.tag{color:#9cafff;letter-spacing:3px;font-size:12px}h1{font-size:38px;margin:12px 0}p{color:#aab4ca;line-height:1.7}.card{background:#191e2c;border:1px solid #30384c;border-radius:20px;padding:26px;margin:20px 0}label{display:block;margin-bottom:10px}textarea,input,select{box-sizing:border-box;width:100%;background:#101521;border:1px solid #3c465f;border-radius:10px;padding:14px;color:#fff;font:inherit}textarea{min-height:130px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:22px 0}button,.download{border:0;border-radius:10px;padding:13px 22px;background:#b7c4ff;color:#10172d;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}button:disabled{opacity:.45;cursor:default}#cancel{background:#36415b;color:white}#status{white-space:pre-wrap;line-height:1.7;color:#c3cdea}video{width:100%;border-radius:12px;margin:14px 0}small{color:#9caac3}[hidden]{display:none!important}@media(max-width:600px){body{margin-top:30px}.row{grid-template-columns:1fr}h1{font-size:30px}}
</style></head><body>
<header><span class="tag">WAN CLOUD STUDIO</span><h1>장면을 적고, 영상으로.</h1><p>내 PC에서는 가볍게. 영상 생성은 클라우드 GPU에서.<br>일반 영상용 텍스트 → 비디오 작업 공간입니다.</p></header>
<div class="card"><form id="form"><label for="prompt">어떤 장면을 만들까요?</label><textarea id="prompt" required maxlength="2000">A small fox walking through a sunlit forest, gentle breeze moving the leaves, cinematic camera movement, natural colors.</textarea><p><small>영어로 장면·움직임·카메라를 적으면 좋습니다.</small></p><div class="row"><div><label for="preset">영상 설정</label><select id="preset"><option value="draft">빠른 시안 · 512×288 · 약 2초 · 20단계</option><option value="standard">기본 · 832×480 · 약 5초 · 30단계</option></select></div><div><label for="seed">시드</label><input id="seed" type="number" min="0" max="2147483647" value="42" required></div></div><button id="generate" disabled>영상 생성</button> <button id="cancel" type="button" hidden>작업 취소</button><p><small>생성 요청 시 GPU 요금이 발생합니다. 처음 실행할 때 모델 준비가 오래 걸릴 수 있습니다.</small></p></form></div>
<div class="card" aria-live="polite"><div id="status">연결 설정 확인 중…</div><video id="video" controls hidden></video><a id="download" class="download" hidden target="_blank" rel="noopener">MP4 열기 / 저장</a><button id="resume" hidden>상태 다시 확인</button></div>
<script>
const $=id=>document.getElementById(id);let job=null,timer=null;
async function api(path,body){const res=await fetch(path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json();if(!res.ok)throw Error(data.error);return data;}
function done(){clearTimeout(timer);$('generate').disabled=false;$('cancel').hidden=true;sessionStorage.removeItem('wan-job');}
async function poll(){try{const data=await api('/api/jobs/'+job);const names={IN_QUEUE:'GPU 배정 대기 중',IN_PROGRESS:'영상을 생성하고 있습니다',COMPLETED:'생성 완료',FAILED:'생성 실패',CANCELLED:'취소됨',TIMED_OUT:'실행 시간 초과'};$('status').textContent=(names[data.status]||data.status)+'\n작업 ID: '+job+(data.output?.seed!==undefined?'\n시드: '+data.output.seed:'');
if(['COMPLETED','FAILED','CANCELLED','TIMED_OUT'].includes(data.status)){done();if(data.error||data.output?.error)$('status').textContent+='\n'+(data.error||data.output.error);if(data.output?.video_url){const url=new URL(data.output.video_url);if(url.protocol!=='https:')throw Error('결과 주소 형식이 올바르지 않습니다.');$('video').src=url.href;$('video').hidden=false;$('download').href=url.href;$('download').hidden=false;}return;}timer=setTimeout(poll,4000);
}catch(e){$('status').textContent=e.message+'\n상태 조회만 중단되었습니다. GPU 작업은 계속 실행될 수 있습니다.';$('resume').hidden=false;}}
$('form').onsubmit=async e=>{e.preventDefault();$('generate').disabled=true;$('video').hidden=true;$('download').hidden=true;$('resume').hidden=true;$('status').textContent='작업 제출 중…';try{const data=await api('/api/jobs',{prompt:$('prompt').value,preset:$('preset').value,seed:Number($('seed').value)});job=data.id;sessionStorage.setItem('wan-job',job);$('cancel').hidden=false;poll();}catch(e){$('status').textContent=e.message;$('generate').disabled=false;}};
$('cancel').onclick=async()=>{try{await api('/api/jobs/'+job+'/cancel',{});$('status').textContent='취소 요청을 보냈습니다. 처리된 작업에 대한 요금은 발생할 수 있습니다.';}catch(e){$('status').textContent=e.message;}};
$('resume').onclick=()=>{$('resume').hidden=true;poll();};
api('/api/config').then(data=>{$('generate').disabled=!data.configured;$('status').textContent=data.configured?'준비되었습니다. 장면을 입력하고 생성하세요.':'.env 파일에 RUNPOD_API_KEY와 RUNPOD_ENDPOINT_ID를 설정한 뒤 프로그램을 다시 실행하세요.';job=sessionStorage.getItem('wan-job');if(job&&data.configured){$('generate').disabled=true;$('cancel').hidden=false;poll();}}).catch(e=>$('status').textContent=e.message);
</script></body></html>
